<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parvida — Conexões que transformam vidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --flame1: #FF4D6D;
    --flame2: #FF8500;
    --flame3: #FFB700;
    --dark: #0D0D14;
    --dark2: #16161F;
    --dark3: #1E1E2C;
    --card: #1A1A26;
    --glass: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #F0EDF5;
    --muted: #8B87A0;
    --radius: 20px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── Background mesh ─── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 10% 20%, rgba(255,77,109,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 90% 80%, rgba(255,133,0,0.1) 0%, transparent 60%),
      radial-gradient(ellipse 80% 30% at 50% 50%, rgba(13,13,20,0) 0%, var(--dark) 100%);
    pointer-events: none;
  }

  /* ─── Screens ─── */
  .screen { position: relative; z-index: 1; min-height: 100vh; display: none; }
  .screen.active { display: flex; }

  /* ─── Auth Screen ─── */
  #auth-screen {
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .auth-box {
    width: 100%; max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 48px 40px;
    backdrop-filter: blur(20px);
    animation: fadeUp 0.6s ease;
  }

  .logo {
    text-align: center; margin-bottom: 36px;
  }
  .logo-icon {
    font-size: 48px; line-height: 1;
    filter: drop-shadow(0 0 20px rgba(255,77,109,0.6));
  }
  .logo h1 {
    font-family: 'Playfair Display', serif;
    font-size: 36px; font-weight: 700;
    background: linear-gradient(135deg, var(--flame1), var(--flame2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-top: 8px;
  }
  .logo p {
    color: var(--muted); font-size: 14px; margin-top: 4px;
    font-style: italic;
  }

  .tabs {
    display: flex; gap: 4px;
    background: var(--dark3); border-radius: 14px; padding: 4px;
    margin-bottom: 32px;
  }
  .tab {
    flex: 1; padding: 10px;
    border: none; background: transparent;
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    border-radius: 10px; cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--flame1), var(--flame2));
    color: white;
    box-shadow: 0 4px 20px rgba(255,77,109,0.3);
  }

  .form-group { margin-bottom: 16px; }
  label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  input, select, textarea {
    width: 100%; padding: 14px 16px;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    outline: none; transition: border 0.2s, box-shadow 0.2s;
    appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--flame1);
    box-shadow: 0 0 0 3px rgba(255,77,109,0.15);
  }
  select option { background: var(--dark3); }
  textarea { resize: none; height: 80px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn-primary {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--flame1) 0%, var(--flame2) 100%);
    border: none; border-radius: 14px;
    color: white; font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 8px 32px rgba(255,77,109,0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(255,77,109,0.4); }
  .btn-primary:active { transform: translateY(0); }

  .error-msg {
    color: var(--flame1); font-size: 13px;
    text-align: center; margin-top: 12px;
    display: none;
  }

  /* ─── App Screen ─── */
  #app-screen { flex-direction: column; }

  .navbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    background: rgba(13,13,20,0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 24px; font-weight: 700;
    background: linear-gradient(135deg, var(--flame1), var(--flame2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .nav-tabs {
    display: flex; gap: 4px;
    background: var(--dark3); border-radius: 50px; padding: 4px;
  }
  .nav-tab {
    padding: 8px 20px; border: none; background: transparent;
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    border-radius: 50px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .nav-tab.active {
    background: linear-gradient(135deg, var(--flame1), var(--flame2));
    color: white;
  }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .user-avatar {
    width: 38px; height: 38px;
    border-radius: 50%; border: 2px solid var(--flame1);
    object-fit: cover; cursor: pointer;
  }
  .btn-logout {
    padding: 8px 16px; border: 1px solid var(--border);
    border-radius: 50px; background: transparent;
    color: var(--muted); font-size: 13px;
    cursor: pointer; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-logout:hover { border-color: var(--flame1); color: var(--flame1); }

  /* ─── Content ─── */
  .content { flex: 1; padding: 32px 24px; max-width: 1100px; margin: 0 auto; width: 100%; }

  /* ─── Discover ─── */
  .discover-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .discover-header h2 {
    font-family: 'Playfair Display', serif; font-size: 28px;
  }
  .discover-header h2 span {
    background: linear-gradient(135deg, var(--flame1), var(--flame2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .filter-badge {
    display: flex; align-items: center; gap: 8px;
    background: var(--glass); border: 1px solid var(--border);
    border-radius: 50px; padding: 8px 16px; font-size: 13px; color: var(--muted);
  }
  .filter-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--flame1); }

  .profiles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .profile-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.5s ease;
    position: relative;
  }
  .profile-card:hover { transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }

  .card-img {
    width: 100%; height: 200px;
    background: var(--dark3);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .card-img img { width: 120px; height: 120px; }
  .card-img-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
  }
  .card-body { padding: 16px; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 700;
  }
  .card-meta {
    color: var(--muted); font-size: 13px; margin-top: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .card-bio {
    font-size: 13px; color: var(--muted); margin-top: 10px;
    line-height: 1.5; min-height: 40px;
  }
  .card-actions {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .btn-like {
    flex: 1; padding: 12px;
    background: linear-gradient(135deg, var(--flame1), var(--flame2));
    border: none; border-radius: 12px; color: white;
    font-size: 22px; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(255,77,109,0.3);
  }
  .btn-like:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(255,77,109,0.5); }
  .btn-like:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-pass {
    padding: 12px 16px;
    background: var(--dark3); border: 1px solid var(--border);
    border-radius: 12px; color: var(--muted);
    font-size: 18px; cursor: pointer;
    transition: all 0.15s;
  }
  .btn-pass:hover { border-color: var(--muted); color: white; }

  /* ─── Matches ─── */
  .matches-empty {
    text-align: center; padding: 80px 24px;
    color: var(--muted);
  }
  .matches-empty .big-icon { font-size: 64px; margin-bottom: 16px; }
  .matches-empty h3 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--text); margin-bottom: 8px; }

  .matches-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .match-card {
    background: var(--card);
    border: 1px solid rgba(255,77,109,0.2);
    border-radius: 18px;
    padding: 24px; text-align: center;
    position: relative; overflow: hidden;
    transition: transform 0.2s;
    animation: fadeUp 0.4s ease;
  }
  .match-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,77,109,0.05), transparent);
    pointer-events: none;
  }
  .match-card:hover { transform: translateY(-3px); }
  .match-card img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--flame1); }
  .match-card h3 { font-family: 'Playfair Display', serif; font-size: 18px; margin-top: 12px; }
  .match-card p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .match-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: linear-gradient(135deg, var(--flame1), var(--flame2));
    color: white; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 50px; margin-top: 10px;
  }

  /* ─── Profile ─── */
  .profile-view {
    max-width: 600px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 28px; overflow: hidden;
  }
  .profile-header {
    display: flex; align-items: center; gap: 20px;
    padding: 32px;
    background: linear-gradient(135deg, rgba(255,77,109,0.1), rgba(255,133,0,0.05));
    border-bottom: 1px solid var(--border);
  }
  .profile-header img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--flame1); }
  .profile-header h2 { font-family: 'Playfair Display', serif; font-size: 26px; }
  .profile-header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .profile-body { padding: 32px; }
  .profile-field { margin-bottom: 24px; }
  .btn-save {
    padding: 14px 32px;
    background: linear-gradient(135deg, var(--flame1), var(--flame2));
    border: none; border-radius: 12px; color: white;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,77,109,0.3); }

  /* ─── Toast ─── */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 24px;
    font-size: 15px; font-weight: 500;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    z-index: 9999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.match { border-color: var(--flame1); background: linear-gradient(135deg, rgba(255,77,109,0.2), rgba(255,133,0,0.1)); }

  /* ─── Empty state ─── */
  .empty-discover {
    grid-column: 1/-1;
    text-align: center; padding: 80px 24px;
    color: var(--muted);
  }
  .empty-discover .big-icon { font-size: 64px; margin-bottom: 16px; }
  .empty-discover h3 { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--text); margin-bottom: 8px; }

  /* ─── Loading ─── */
  .loader {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* ─── Animations ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ─── Stats bar ─── */
  .stats-bar {
    display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .stat-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--glass); border: 1px solid var(--border);
    border-radius: 50px; padding: 8px 16px; font-size: 13px;
  }
  .stat-pill strong { color: var(--flame1); }

  /* ─── Gender icons ─── */
  .gender-icon { font-size: 16px; }

  @media (max-width: 600px) {
    .auth-box { padding: 32px 24px; }
    .nav-tabs { display: none; }
    .content { padding: 20px 16px; }
    .profiles-grid { grid-template-columns: 1fr 1fr; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ─── AUTH SCREEN ─── -->
<div id="auth-screen" class="screen active">
  <div class="auth-box">
    <div class="logo">
      
      <img src="/logo.png" alt="ParVida" style="width:200px;margin-bottom:8px;">
      <p style="color:#8B87A0;font-size:13px;font-style:italic;">Um novo amor, uma nova história para a vida toda</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Entrar</button>
      <button class="tab" onclick="switchTab('register')">Cadastrar</button>
    </div>

    <!-- Login Form -->
    <div id="login-form">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="login()">Entrar</button>
      <div class="error-msg" id="login-error"></div>
    </div>

    <!-- Register Form -->
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="reg-name" placeholder="Como você se chama?">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="reg-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Idade</label>
          <input type="number" id="reg-age" placeholder="25" min="18" max="99">
        </div>
        <div class="form-group">
          <label>Cidade</label>
          <input type="text" id="reg-city" placeholder="São Paulo">
        </div>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Gênero</label>
          <select id="reg-gender">
            <option value="">Selecione...</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Interesse em</label>
          <select id="reg-interest">
            <option value="">Selecione...</option>
            <option value="masculino">Homens</option>
            <option value="feminino">Mulheres</option>
            <option value="outro">Todos</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Bio (opcional)</label>
        <textarea id="reg-bio" placeholder="Fale um pouco sobre você..."></textarea>
      </div>
      <button class="btn-primary" onclick="register()">Criar conta</button>
      <div class="error-msg" id="register-error"></div>
    </div>
  </div>
</div>

<!-- ─── APP SCREEN ─── -->
<div id="app-screen" class="screen">
  <nav class="navbar">
    <img src="/logo.png" alt="ParVida" style="height:36px;">
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showSection('discover')" id="tab-discover">
        🔍 Descobrir
      </button>
      <button class="nav-tab" onclick="showSection('matches')" id="tab-matches">
        💞 Matches
      </button>
      <button class="nav-tab" onclick="showSection('profile')" id="tab-profile">
        👤 Perfil
      </button>
    </div>
    <div class="nav-right">
      <img class="user-avatar" id="nav-avatar" src="" alt="avatar">
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </nav>

  <div class="content">
    <!-- DISCOVER -->
    <div id="section-discover">
      <div class="discover-header">
        <div>
          <h2>Descobrir <span id="discover-label">pessoas</span></h2>
          <p style="color:var(--muted);font-size:14px;margin-top:4px">Pessoas que combinam com você</p>
        </div>
        <div class="filter-badge">
          <div class="filter-dot"></div>
          <span id="filter-text">Filtrando...</span>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat-pill">🔥 <strong id="stat-available">—</strong> pessoas disponíveis</div>
        <div class="stat-pill">💞 <strong id="stat-matches">—</strong> matches</div>
      </div>
      <div class="profiles-grid" id="profiles-grid">
        <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">
          <div class="loader"></div>
          <p style="margin-top:16px">Carregando...</p>
        </div>
      </div>
    </div>

    <!-- MATCHES -->
    <div id="section-matches" style="display:none">
      <div class="discover-header">
        <div>
          <h2>Seus <span style="background:linear-gradient(135deg,var(--flame1),var(--flame2));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Matches</span></h2>
          <p style="color:var(--muted);font-size:14px;margin-top:4px">Conexões mútuas — vocês se curtiram!</p>
        </div>
      </div>
      <div class="matches-grid" id="matches-grid"></div>
    </div>

    <!-- PROFILE -->
    <div id="section-profile" style="display:none">
      <div class="discover-header">
        <div>
          <h2>Meu <span style="background:linear-gradient(135deg,var(--flame1),var(--flame2));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Perfil</span></h2>
        </div>
      </div>
      <div class="profile-view">
        <div class="profile-header">
          <img id="profile-avatar" src="" alt="avatar">
          <div>
            <h2 id="profile-name"></h2>
            <p id="profile-meta"></p>
          </div>
        </div>
        <div class="profile-body">

          <!-- FOTOS -->
          <div class="profile-field">
            <label>📸 Minhas Fotos (até 5)</label>
            <div id="photos-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;"></div>
            <div id="upload-area" onclick="document.getElementById('photo-input').click()"
              style="border:2px dashed var(--border);border-radius:14px;padding:24px;text-align:center;cursor:pointer;color:var(--muted);">
              <div style="font-size:32px;margin-bottom:8px;">📷</div>
              <div style="font-size:14px;">Clique para adicionar fotos</div>
              <div style="font-size:12px;margin-top:4px;">JPG ou PNG — máximo 5 fotos</div>
            </div>
            <input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="uploadPhotos(this)">
          </div>

          <div class="profile-field">
            <label>Idade</label>
            <input type="number" id="profile-age" min="18" max="99">
          </div>
          <div class="profile-field">
            <label>Cidade</label>
            <input type="text" id="profile-city" placeholder="Sua cidade">
          </div>
          <div class="profile-field">
            <label>Bio</label>
            <textarea id="profile-bio" placeholder="Fale sobre você..."></textarea>
          </div>
          <button class="btn-save" onclick="saveProfile()">💾 Salvar alterações</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:3000';
let token = localStorage.getItem('parvida_token');
let currentUser = null;

// ─── Auth ──────────────────────────────────────────────────────────────────
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('login-form').style.display = t === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = t === 'register' ? 'block' : 'none';
  hideErrors();
}

function hideErrors() {
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('register-error').style.display = 'none';
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showError('login-error', 'Preencha todos os campos.');
  try {
    const r = await fetch(`${API}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await r.json();
    if (!r.ok) return showError('login-error', data.error || 'Erro ao entrar.');
    token = data.token;
    localStorage.setItem('parvida_token', token);
    currentUser = data.user;
    enterApp();
  } catch { showError('login-error', 'Servidor offline. Inicie o servidor primeiro.'); }
}

async function register() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const age = document.getElementById('reg-age').value;
  const gender = document.getElementById('reg-gender').value;
  const interest = document.getElementById('reg-interest').value;
  const bio = document.getElementById('reg-bio').value.trim();
  const city = document.getElementById('reg-city').value.trim();
  if (!name || !email || !password || !age || !gender || !interest)
    return showError('register-error', 'Preencha todos os campos obrigatórios.');
  if (password.length < 6) return showError('register-error', 'Senha mínima: 6 caracteres.');
  if (parseInt(age) < 18) return showError('register-error', 'Você precisa ter 18+ anos.');
  try {
    const r = await fetch(`${API}/api/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, age, gender, interest, bio, city })
    });
    const data = await r.json();
    if (!r.ok) return showError('register-error', data.error || 'Erro ao cadastrar.');
    token = data.token;
    localStorage.setItem('parvida_token', token);
    currentUser = data.user;
    enterApp();
  } catch { showError('register-error', 'Servidor offline. Inicie o servidor primeiro.'); }
}

async function logout() {
  await fetch(`${API}/api/logout`, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token }
  }).catch(() => {});
  token = null; currentUser = null;
  localStorage.removeItem('parvida_token');
  document.getElementById('auth-screen').classList.add('active');
  document.getElementById('app-screen').classList.remove('active');
}

// ─── App ───────────────────────────────────────────────────────────────────
function enterApp() {
  document.getElementById('auth-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  updateNavUser();
  showSection('discover');
  loadDiscover();
  loadMatches();
}

function updateNavUser() {
  if (!currentUser) return;
  document.getElementById('nav-avatar').src = currentUser.avatar;
}

function showSection(s) {
  ['discover','matches','profile'].forEach(id => {
    document.getElementById('section-' + id).style.display = id === s ? 'block' : 'none';
    document.getElementById('tab-' + id)?.classList.toggle('active', id === s);
  });
  if (s === 'matches') loadMatches();
  if (s === 'profile') loadProfileSection();
}

// ─── Discover ──────────────────────────────────────────────────────────────
async function loadDiscover() {
  try {
    const r = await fetch(`${API}/api/discover`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const people = await r.json();
    renderProfiles(people);
    document.getElementById('stat-available').textContent = people.length;
  } catch { showToast('⚠️ Não foi possível carregar perfis.'); }
}

function renderProfiles(people) {
  const grid = document.getElementById('profiles-grid');
  const interest = currentUser?.interest || '';
  const genderLabel = { masculino: 'Homens', feminino: 'Mulheres', outro: 'Todos' };
  document.getElementById('filter-text').textContent = genderLabel[interest] || interest;
  document.getElementById('discover-label').textContent = genderLabel[interest]?.toLowerCase() || 'pessoas';

  if (!people.length) {
    grid.innerHTML = `<div class="empty-discover">
      <div class="big-icon">✨</div>
      <h3>Você viu todo mundo!</h3>
      <p>Mais pessoas entrarão em breve. Enquanto isso, veja seus matches!</p>
    </div>`;
    return;
  }
  grid.innerHTML = people.map(p => `
    <div class="profile-card" id="card-${p.id}">
      <div class="card-img">
        <img src="${p.avatar}" alt="${p.name}">
        <div class="card-img-overlay"></div>
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-meta">
          <span>${p.age} anos</span>
          <span>·</span>
          <span>${p.city || 'Brasil'}</span>
        </div>
        <div class="card-bio">${p.bio || 'Sem bio ainda.'}</div>
        <div class="card-actions">
          <button class="btn-like" onclick="like('${p.id}')" id="like-${p.id}" title="Curtir">❤️ Curtir</button>
          <button class="btn-pass" onclick="pass('${p.id}')" title="Passar">✕</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function like(id) {
  const btn = document.getElementById('like-' + id);
  btn.disabled = true; btn.innerHTML = '<div class="loader"></div>';
  try {
    const r = await fetch(`${API}/api/like/${id}`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await r.json();
    removeCard(id);
    if (data.matched) {
      showToast(`🔥 É um match com ${data.target.name}! Vocês se curtiram!`, true);
      const c = document.getElementById('stat-matches');
      c.textContent = (parseInt(c.textContent) || 0) + 1;
    } else {
      showToast(`❤️ Você curtiu ${data.target.name}!`);
    }
    updateAvailableCount();
  } catch { btn.disabled = false; btn.innerHTML = '❤️ Curtir'; }
}

function pass(id) {
  removeCard(id);
  updateAvailableCount();
}

function removeCard(id) {
  const card = document.getElementById('card-' + id);
  if (card) {
    card.style.transition = 'all 0.3s';
    card.style.opacity = '0';
    card.style.transform = 'scale(0.9)';
    setTimeout(() => card.remove(), 300);
  }
}

function updateAvailableCount() {
  const count = document.querySelectorAll('.profile-card').length;
  document.getElementById('stat-available').textContent = count;
  if (count === 0) {
    document.getElementById('profiles-grid').innerHTML = `<div class="empty-discover">
      <div class="big-icon">✨</div>
      <h3>Você viu todo mundo!</h3>
      <p>Mais pessoas entrarão em breve. Veja seus matches!</p>
    </div>`;
  }
}

// ─── Matches ───────────────────────────────────────────────────────────────
async function loadMatches() {
  try {
    const r = await fetch(`${API}/api/matches`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const matches = await r.json();
    document.getElementById('stat-matches').textContent = matches.length;
    renderMatches(matches);
  } catch {}
}

function renderMatches(matches) {
  const grid = document.getElementById('matches-grid');
  if (!matches.length) {
    grid.innerHTML = `<div class="matches-empty" style="grid-column:1/-1">
      <div class="big-icon">💞</div>
      <h3>Nenhum match ainda</h3>
      <p>Continue curtindo pessoas para encontrar seus matches!</p>
    </div>`;
    return;
  }

  const myPhotos = (currentUser.photos || []).length;
  const canSeeAll = myPhotos >= 3;

  grid.innerHTML = matches.map(m => {
    const photos = m.photos || [];
    const photosHtml = canSeeAll && photos.length > 1
      ? `<div style="display:grid;grid-template-columns:repeat(${Math.min(photos.length,3)},1fr);gap:6px;margin-top:12px;">
          ${photos.map(p => `<img src="${p}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;">`).join('')}
        </div>`
      : '';

    const lockMsg = !canSeeAll && photos.length > 1
      ? `<div style="margin-top:10px;padding:8px;background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);border-radius:10px;font-size:12px;color:var(--muted);text-align:center;">
          🔒 Adicione 3 ou mais fotos para ver todas as fotos deste match
        </div>`
      : '';

    return `
    <div class="match-card">
      <img src="${m.avatar}" alt="${m.name}">
      <h3>${m.name}</h3>
      <p>${m.age} anos · ${m.city || 'Brasil'}</p>
      <div class="match-badge">🔥 Match!</div>
      <p style="color:var(--muted);font-size:12px;margin-top:8px">${m.bio || ''}</p>
      ${photosHtml}
      ${lockMsg}
    </div>`;
  }).join('');
}

// ─── Profile ───────────────────────────────────────────────────────────────
function loadProfileSection() {
  if (!currentUser) return;
  document.getElementById('profile-avatar').src = currentUser.avatar;
  document.getElementById('profile-name').textContent = currentUser.name;
  const gLabel = { masculino: 'Homem', feminino: 'Mulher', outro: 'Outro' };
  document.getElementById('profile-meta').textContent =
    `${currentUser.age} anos · ${gLabel[currentUser.gender] || currentUser.gender} · ${currentUser.city || ''}`;
  document.getElementById('profile-age').value = currentUser.age;
  document.getElementById('profile-city').value = currentUser.city || '';
  document.getElementById('profile-bio').value = currentUser.bio || '';
  renderPhotosGrid();
}

function renderPhotosGrid() {
  const grid = document.getElementById('photos-grid');
  const photos = currentUser.photos || [];
  grid.innerHTML = photos.map(p => `
    <div style="position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--dark3);">
      <img src="${p}" style="width:100%;height:100%;object-fit:cover;">
      <button onclick="deletePhoto('${p}')"
        style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.7);border:none;border-radius:50%;
        width:24px;height:24px;color:white;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;">✕</button>
    </div>
  `).join('');
  const uploadArea = document.getElementById('upload-area');
  if (uploadArea) uploadArea.style.display = photos.length >= 5 ? 'none' : 'block';
}

async function uploadPhotos(input) {
  const files = Array.from(input.files).slice(0, 5 - (currentUser.photos || []).length);
  if (!files.length) return;
  const formData = new FormData();
  files.forEach(f => formData.append('photos', f));
  showToast('⏳ Enviando fotos...');
  try {
    const r = await fetch(`${API}/api/photos`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: formData
    });
    const data = await r.json();
    if (!r.ok) return showToast('⚠️ ' + (data.error || 'Erro ao enviar fotos.'));
    currentUser = data;
    renderPhotosGrid();
    updateNavUser();
    showToast('✅ Fotos adicionadas!');
  } catch { showToast('⚠️ Erro ao enviar fotos.'); }
  input.value = '';
}

async function deletePhoto(photoPath) {
  const filename = photoPath.split('/').pop();
  try {
    const r = await fetch(`${API}/api/photos/${filename}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await r.json();
    if (!r.ok) return showToast('⚠️ Erro ao remover foto.');
    currentUser = data;
    renderPhotosGrid();
    updateNavUser();
    showToast('🗑️ Foto removida.');
  } catch { showToast('⚠️ Erro ao remover foto.'); }
}

async function saveProfile() {
  const age = document.getElementById('profile-age').value;
  const city = document.getElementById('profile-city').value.trim();
  const bio = document.getElementById('profile-bio').value.trim();
  try {
    const r = await fetch(`${API}/api/profile`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ age, city, bio })
    });
    const data = await r.json();
    currentUser = data;
    showToast('✅ Perfil atualizado!');
    loadProfileSection();
  } catch { showToast('⚠️ Erro ao salvar.'); }
}

// ─── Toast ─────────────────────────────────────────────────────────────────
let toastTimeout;
function showToast(msg, isMatch = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isMatch ? ' match' : '');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 3500);
}

// ─── Init ──────────────────────────────────────────────────────────────────
(async () => {
  if (token) {
    try {
      const r = await fetch(`${API}/api/me`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (r.ok) {
        currentUser = await r.json();
        enterApp();
        return;
      }
    } catch {}
    localStorage.removeItem('parvida_token');
    token = null;
  }
})();
</script>
</body>
</html>
